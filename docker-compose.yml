# version: "3.9"

services:

  # =========================
  # PostgreSQL Database
  # =========================
  postgres:
    image: postgres:15
    container_name: orionis-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # =========================
  # API Gateway (Twilio entrypoint)
  # =========================
  api-gateway:
    build: ./services/api-gateway
    container_name: api-gateway
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - text2sql
      # - sql-guard
      # - sql-executor
      # - audit

  # =========================
  # Ollama Service
  # =========================

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  # =========================
  # Text2SQL Service
  # =========================
  text2sql:
    build: ./services/text2sql
    container_name: text2sql
    restart: always
    env_file:
      - .env
    ports:
      - "8001:8001"
    depends_on:
      - ollama

  # =========================
  # SQL Guard (Security & Roles)
  # =========================
  # sql-guard:
  #   build: ./services/sql-guard
  #   container_name: sql-guard
  #   restart: always

  # # =========================
  # # SQL Executor (ONLY DB ACCESS)
  # # =========================
  # sql-executor:
  #   build: ./services/sql-executor
  #   container_name: sql-executor
  #   restart: always
  #   env_file:
  #     - .env
  #   depends_on:
  #     - postgres

  # # =========================
  # # Audit Service
  # # =========================
  # audit:
  #   build: ./services/audit
  #   container_name: audit
  #   restart: always
  #   env_file:
  #     - .env

# =========================
# Persistent Volumes
# =========================
volumes:
  postgres_data:
  ollama_data:
