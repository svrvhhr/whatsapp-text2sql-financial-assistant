services:
  # =========================
  # PostgreSQL Database
  # =========================
  ngrok:
    image: ngrok/ngrok:latest
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    command: ["http", "api-gateway:8000"]
    depends_on:
      - api-gateway

  postgres:
    image: postgres:15
    container_name: orionis-postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # =========================
  # API Gateway (Twilio entrypoint)
  # =========================
  api-gateway:
    build: ./services/api-gateway
    container_name: api-gateway
    restart: always
    env_file:
      - .env
    environment:
      TEXT2SQL_URL: "http://text2sql:8000"
      SQL_GUARD_URL: "http://sql-guard:8000"
      SQL_EXECUTOR_URL: "http://sql-executor:8000"
      RESPONSE_WRITER_URL: "http://response-writer:8000"
      AUDIT_URL: "http://audit:8000"
      DEFAULT_ROLE: "ReadOnly"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  # =========================
  # Text2SQL Service
  # =========================
  text2sql:
    build: ./services/text2sql
    container_name: text2sql
    restart: always
    env_file:
      - .env
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy

  # =========================
  # SQL Guard (Security & Roles)
  # =========================
  sql-guard:
    build: ./services/sql-guard
    container_name: sql-guard
    restart: always
    env_file:
      - .env
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy

  # =========================
  # SQL Executor (ONLY DB ACCESS)
  # =========================
  sql-executor:
    build: ./services/sql-executor
    container_name: sql-executor
    restart: always
    env_file:
      - .env
    environment:
      SQL_GUARD_URL: "http://sql-guard:8000"
      AUDIT_URL: "http://audit:8000"
    ports:
      - "8003:8000"
    depends_on:
      postgres:
        condition: service_healthy

  # =========================
  # Audit Service
  # =========================
  audit:
    build: ./services/audit
    container_name: audit
    restart: always
    env_file:
      - .env
    ports:
      - "8004:8000"
    depends_on:
      postgres:
        condition: service_healthy

  # =========================
  # Response Writer
  # =========================
  response-writer:
    build: ./services/response-writer
    container_name: response-writer
    restart: always
    env_file:
      - .env
    environment:
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL}"
    ports:
      - "8005:8000"

  # =========================
  # Audit UI
  # =========================
  audit-ui:
    build:
      context: ./services/audit-ui
    container_name: audit-ui
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AUDIT_API_URL: "http://audit:8000"
    depends_on:
      - audit
    ports:
      - "8501:8501"

  # =========================
  # Test UI Streamlit
  # =========================
  test-ui-streamlit:
    build:
      context: ./services/test-ui-streamlit
    container_name: test-ui-streamlit
    restart: always
    env_file:
      - .env
    environment:
      API_GATEWAY_SIMULATE_URL: "http://api-gateway:8000/simulate"
    ports:
      - "8502:8502"
    depends_on:
      - api-gateway

volumes:
  postgres_data:
