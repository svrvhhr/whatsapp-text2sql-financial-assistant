# version: "3.9"

services:

  # =========================
  # PostgreSQL Database
  # =========================
  postgres:
    image: postgres:15
    container_name: orionis-postgres
    restart: always
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # =========================
  # API Gateway (Twilio entrypoint)
  # =========================
  api-gateway:
    build: ./services/api-gateway
    container_name: api-gateway
    restart: always
    env_file:
      - .env
    environment:
      TEXT2SQL_URL: "http://text2sql:8000"
      SQL_GUARD_URL: "http://sql-guard:8000"
      SQL_EXECUTOR_URL: "http://sql-executor:8000"
      RESPONSE_WRITER_URL: http://response-writer:8000
      DEFAULT_ROLE: "ReadOnly"
      
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - text2sql
      - sql-guard
      - sql-executor
      - audit

  # =========================
  # Text2SQL Service
  # =========================
  text2sql:
    build: ./services/text2sql
    container_name: text2sql
    restart: always
    env_file:
      - .env
    ports:
      - "8001:8000"
    depends_on:
      - postgres

  # =========================
  # SQL Guard (Security & Roles)
  # =========================
  sql-guard:
    build: ./services/sql-guard
    container_name: sql-guard
    restart: always
    env_file:
      - .env
    environment:
      GUARD_AUTO_LIMIT: "1"
      GUARD_MAX_ROWS: "200"
    ports:
      - "8002:8000"
    depends_on:
      - postgres

  # =========================
  # SQL Executor (ONLY DB ACCESS)
  # =========================
  sql-executor:
    build: ./services/sql-executor
    container_name: sql-executor
    restart: always
    env_file:
      - .env
    environment:
      SQL_GUARD_URL: "http://sql-guard:8000"
      AUDIT_URL: http://audit:8000
      DB_STATEMENT_TIMEOUT_MS: "5000"
      MAX_RETURN_ROWS: "200"
    ports:
      - "8003:8000"
    depends_on:
      - postgres
      - sql-guard

  # =========================
  # Audit Service
  # =========================
  audit:
    build: ./services/audit
    container_name: audit
    restart: always
    env_file:
      - .env
    environment:
      AUDIT_TABLE_NAME: "audit_service_event"
      AUDIT_AUTO_MIGRATE: "1"
      LOG_LEVEL: "INFO"
      AUDIT_TABLE: "audit_service_event"
    depends_on:
      - postgres
    ports:
      - "8004:8000"

  response-writer:
    build: ./services/response-writer
    container_name: response-writer
    restart: always
    env_file:
      - .env
    environment:
      - WRITER_TIMEOUT_S=12
      - WRITER_MAX_ITEMS=10
      - WRITER_MAX_TEXT_CHARS=1200

      - LLM_PROVIDER=openai
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=https://api.openai.com/v1
      - OPENAI_MODEL=gpt-4o-mini
    ports:
      - "8005:8000"

  audit-ui:
    build:
      context: ./services/audit-ui
    container_name: audit-ui
    environment:
      - AUDIT_API_URL=http://audit:8000
      - AUDIT_ADMIN_USER=admin
      - AUDIT_ADMIN_PASS=admin
      - AUDIT_UI_DEFAULT_RANGE_HOURS=24
      - AUDIT_UI_DEFAULT_LIMIT=200
      - AUDIT_UI_TIMEOUT_S=10
    depends_on:
      - audit
    ports:
      - "8501:8501"
    restart: unless-stopped

# =========================
# Persistent Volumes
# =========================
volumes:
  postgres_data:
  ollama_data:
